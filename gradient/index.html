<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Gradients</h1>

    <div class="container">

        <div class="gradient-box linear">
            <h2>Linear Gradient</h2>
            <p>Colors change in a straight direction.</p>
        </div>

        <div class="gradient-box radial">
            <h2>Radial Gradient</h2>
            <p>Colors spread outward from a center point.</p>
        </div>

        <div class="gradient-box conic">
            <h2>Conic Gradient</h2>
            <p>Colors rotate around a center point.</p>
        </div>

        <div class="gradient-box diagonal">
            <h2>Diagonal Gradient</h2>
            <p>A linear gradient moving diagonally.</p>
        </div>

    </div>

</body>
</html>
