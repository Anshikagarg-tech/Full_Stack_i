<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Scroll with Sticky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Anime Gallery</h1>

    <div class="main">

        <!-- Sticky element -->
        <div class="sticky-box">
            <h2>Categories</h2>
            <p>Anime</p>
            <p>Movies</p>
            <p>Characters</p>
        </div>

        <!-- Horizontal scrolling area -->
        <div class="scroll-area">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba">
                <h2>Anime World</h2>
                <p>Explore amazing anime worlds.</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477">
                <h2>Characters</h2>
                <p>Discover memorable characters.</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f">
                <h2>Japanese Culture</h2>
                <p>Learn about Japanese culture.</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542051841857-5f90071e7989">
                <h2>Tokyo</h2>
                <p>Explore the city of Tokyo.</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1528360983277-13d401cdc186">
                <h2>Japan</h2>
                <p>Beautiful places in Japan.</p>
            </div>

        </div>

    </div>

</body>
</html>
